# Dependabot configuration for Solidarity Platform
# Manages dependency updates for JavaScript/Node.js packages

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Maintain mathematical precision - be cautious with updates
    open-pull-requests-limit: 5
    reviewers:
      - "CharlyOlson"
    labels:
      - "dependencies"
      - "solidarity-platform"
